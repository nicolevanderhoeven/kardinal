# Alternative docker-compose file for using a pre-built image from a registry
# Usage: docker-compose -f docker-compose.registry.yml up -d
# Update the image name below to match your registry (e.g., username/kardinal:latest)

services:
  kardinal:
    # To pin an exact build instead of following :latest, see
    # update-kardinal-pinned.sh (it sets KARDINAL_IMAGE to an image@sha256:... reference).
    image: ${KARDINAL_IMAGE:-nvanderhoeven/kardinal:latest}
    container_name: kardinal
    restart: unless-stopped
    volumes:
      - /srv/kardinal/kardinal_public:/srv/kardinal/kardinal_public:ro
    environment:
      - KANBAN_MARKDOWN_FILE=/srv/kardinal/kardinal_public/Grafana Labs Kanban.md
      # Tracing is off by default (the image sets OTEL_TRACES_EXPORTER=none).
      # To send traces to Alloy's OTLP/HTTP receiver on the Docker host (the
      # gateway of the traefik network), uncomment these:
      # - OTEL_TRACES_EXPORTER=otlp
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://172.19.0.1:4318
      # - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,host.name=kardinal
    # Hardening: the app needs no write access, no privileges and little memory.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - traefik

networks:
  traefik:
    external: true

