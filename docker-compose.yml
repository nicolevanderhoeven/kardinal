# For using a registry image instead, see docker-compose.registry.yml
# Or replace 'build: .' with 'image: YOUR_USERNAME/kardinal:latest'

services:
  kardinal:
    build: .
    # Alternative: uncomment to use a registry image instead of building
    # image: YOUR_USERNAME/kardinal:latest
    container_name: kardinal
    restart: unless-stopped
    volumes:
      - /srv/kardinal/kardinal_public:/srv/kardinal/kardinal_public:ro
    environment:
      - KANBAN_MARKDOWN_FILE=/srv/kardinal/kardinal_public/Grafana Labs Kanban.md
    # Hardening: the app needs no write access, no privileges and little memory.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - traefik

networks:
  traefik:
    external: true

