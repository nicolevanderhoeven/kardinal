services:
  traefik:
    # v3.6 is end-of-life; v3.7.20 was the latest 3.7.x stable when this was
    # written. Read the Traefik migration notes before bumping minor versions.
    image: traefik:v3.7.20
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The Docker socket is deliberately NOT mounted: the Docker provider is
      # off, and a socket mount (even :ro) would give anyone who breaks Traefik
      # root on the host. Mount it only if you re-enable the Docker provider.
      - /srv/traefik/letsencrypt:/letsencrypt
      - /srv/traefik/dynamic:/etc/traefik/dynamic:ro
    command:
      # The Traefik API/dashboard is intentionally disabled: --api.insecure=true
      # serves it unauthenticated on port 8080. To use it, publish 8080 only on
      # 127.0.0.1 ("127.0.0.1:8080:8080") and re-add --api.insecure=true.
      # Docker provider disabled due to API version incompatibility (and so no
      # docker.sock mount, see above)
      # - --providers.docker=true
      # - --providers.docker.exposedbydefault=false
      # - --providers.docker.network=traefik
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=nicole@nicolevanderhoeven.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    networks:
      - traefik

networks:
  traefik:
    external: true

